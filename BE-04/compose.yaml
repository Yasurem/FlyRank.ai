services:
  api:
    build: .
    ports: ["3000:3000"]
    environment: 
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - .:/app
    depends_on: [db]
  db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tasks
    volumes: [taskdata:/var/lib/postgresql/data]
volumes:
  taskdata: