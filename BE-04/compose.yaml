services:
  api:
    build: .
    ports: ["8000:8000"]
    environment: 
      DATABASE_URL: ${DATABASE_URL}
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tasks
    volumes: [taskdata:/var/lib/postgresql/data]
volumes:
  taskdata: